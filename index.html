<!DOCTYPE html>
<html>
<head>
  <title>A.R.C.</title>

  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 40px;
    }

    p {
      color: #cccccc;
    }

    .chapters {
  max-width: 600px;
  margin: 20px auto 40px auto;
}

.chapter-card {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 18px 22px;
  margin: 10px 0;

  background-color: #181818;
  color: white;

  border: 1px solid #333;
  border-radius: 8px;

  text-decoration: none;
}

.chapter-card:hover {
  background-color: #252525;
}

.chapter-card span {
  color: #aaa;
}
    
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: white;
      color: black;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <h1>Welcome to A.R.C. by Yazeus YSR</h1>

  <p>This site is currently for early readers.</p>

  <h2>Chapters</h2>

<div class="chapters" id="chapter-list"></div>
  
  <a class="button" href="characters.html">Characters</a>
  <a class="button" href="world.html">World</a>
  <a class="button" href="powers.html">Powers</a>

<script>
  const chapters = {
    "7": {
      title: "Gathering Storm"
    }
  };

  const chapterList = document.getElementById("chapter-list");

  Object.keys(chapters)
    .map(Number)
    .sort((a, b) => a - b)
    .forEach(chapterNumber => {

      const chapter = chapters[chapterNumber];

      const link = document.createElement("a");
      link.className = "chapter-card";
      link.href = "reader.html?chapter=" + chapterNumber;

      link.innerHTML =
        "<strong>Chapter " + chapterNumber + "</strong>" +
        "<span>" + chapter.title + "</span>";

      chapterList.appendChild(link);
    });
</script>
  
</body>
</html>
