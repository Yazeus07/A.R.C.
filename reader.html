<!DOCTYPE html>
<html>
<head>
  <title>Read Manga</title>

  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .chapter-nav {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 10px;
  font-size: 14px;
  color: #aaa;
}
    .topbar {
  position: sticky;
  top: 0;
  background-color: #111;
  padding: 15px;
  border-bottom: 1px solid #333;
  z-index: 10;
}

.topbar h1 {
  margin: 8px 0;
  font-size: 24px;
}

.topbar p {
  margin: 0;
  color: #aaa;
}

    .manga-page {
      display: block;
      width: 100%;
      max-width: 900px;
      margin: 0 auto 10px auto;
    }

    a {
      color: white;
    }

    .review-box {
  max-width: 700px;
  margin: 60px auto;
  padding: 25px;
  background-color: #181818;
  border: 1px solid #333;
  border-radius: 10px;
  text-align: left;
}

.review-box h2 {
  text-align: center;
}

.rating {
  margin: 18px 0;
}

select,
textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  background-color: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

    .stars button {
  background: none;
  border: none;
  font-size: 32px;
  cursor: pointer;
  color: #666;
  padding: 4px;
}

.stars button.active {
  color: gold;
}
    
  </style>
</head>

<body>

  <div class="topbar">
  <a href="index.html">← Home</a>

  <h1 id="chapter-title">Chapter 7</h1>
    
<!--CHAPTER PAGES -->
 
  
  <div class="chapter-nav">
  <a id="prev-chapter" href="#">← Previous Chapter</a>
  <span id="current-chapter">Chapter 7</span>
  <a id="next-chapter" href="#">Next Chapter →</a>
</div>
</div>

<div id="manga-pages"></div>

  <div class="review-box" id="review-form">

  <h2 id="review-title">Review Chapter 7</h2>

  <div class="rating">
  <label>Story</label>

  <div class="stars" data-rating-name="story">
    <button type="button" onclick="setRating('story', 1)">★</button>
    <button type="button" onclick="setRating('story', 2)">★</button>
    <button type="button" onclick="setRating('story', 3)">★</button>
    <button type="button" onclick="setRating('story', 4)">★</button>
    <button type="button" onclick="setRating('story', 5)">★</button>
  </div>

  <input type="hidden" id="story" value="5">
</div>

  <div class="rating">
  <label>Art</label>

  <div class="stars" data-rating-name="art">
    <button type="button" onclick="setRating('art', 1)">★</button>
    <button type="button" onclick="setRating('art', 2)">★</button>
    <button type="button" onclick="setRating('art', 3)">★</button>
    <button type="button" onclick="setRating('art', 4)">★</button>
    <button type="button" onclick="setRating('art', 5)">★</button>
  </div>

  <input type="hidden" id="art" value="5">
</div>

  <div class="rating">
  <label>Characters</label>

  <div class="stars" data-rating-name="characters">
    <button type="button" onclick="setRating('characters', 1)">★</button>
    <button type="button" onclick="setRating('characters', 2)">★</button>
    <button type="button" onclick="setRating('characters', 3)">★</button>
    <button type="button" onclick="setRating('characters', 4)">★</button>
    <button type="button" onclick="setRating('characters', 5)">★</button>
  </div>

  <input type="hidden" id="characters" value="5">
</div>

  <div class="rating">
  <label>Worldbuilding</label>

  <div class="stars" data-rating-name="worldbuilding">
    <button type="button" onclick="setRating('worldbuilding', 1)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 2)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 3)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 4)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 5)">★</button>
  </div>

  <input type="hidden" id="worldbuilding" value="5">
</div>

  <div class="rating">
    <label>Written feedback</label>
    <textarea id="feedback" rows="6" placeholder="What did you think of this chapter?"></textarea>
  </div>

  
      
  <button id="submit-review-button" onclick="submitReview()">Submit Review</button>

</div>

  <div class="review-box" id="reader-ratings" style="display: none;">
  <h2>Reader Ratings</h2>

  <p>Story: <strong id="avg-story">—</strong> / 5</p>
  <p>Art: <strong id="avg-art">—</strong> / 5</p>
  <p>Characters: <strong id="avg-characters">—</strong> / 5</p>
  <p>Worldbuilding: <strong id="avg-worldbuilding">—</strong> / 5</p>

  <p id="review-count">No reviews yet</p>
</div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const params = new URLSearchParams(window.location.search);
const chapterNumber = params.get("chapter") || "7";
   
  const chapters = {
  "7": {
    title: "Gathering Storm",
    pages: 18
  }
};

const pageCount = chapters[chapterNumber]?.pages || 0;

const mangaPages = document.getElementById("manga-pages");

for (let i = 1; i <= pageCount; i++) {
  const img = document.createElement("img");

  const pageNumber = String(i).padStart(2, "0");

  img.className = "manga-page";
  img.src = "chapter-" + chapterNumber.padStart(2, "0") + "-web/page-" + pageNumber + ".jpg";

  mangaPages.appendChild(img);
}
  const chapterNum = parseInt(chapterNumber);

// List every chapter that currently exists
const availableChapters = Object.keys(chapters).map(Number);

const currentIndex = availableChapters.indexOf(chapterNum);

document.getElementById("current-chapter").textContent =
  "Chapter " + chapterNumber;

const prevLink = document.getElementById("prev-chapter");
const nextLink = document.getElementById("next-chapter");

// Previous Chapter
if (currentIndex > 0) {
  prevLink.href =
    "reader.html?chapter=" + availableChapters[currentIndex - 1];
} else {
  prevLink.style.visibility = "hidden";
}

// Next Chapter
if (
  currentIndex !== -1 &&
  currentIndex < availableChapters.length - 1
) {
  nextLink.href =
    "reader.html?chapter=" + availableChapters[currentIndex + 1];
} else {
  nextLink.style.visibility = "hidden";
}
  


const chapterTitle = chapters[chapterNumber]?.title || "";

document.getElementById("chapter-title").textContent =
  "Chapter " + chapterNumber + (chapterTitle ? " - " + chapterTitle : "");

document.getElementById("review-title").textContent =
  "Review Chapter " + chapterNumber;
  window.setRating = function(name, value) {
  document.getElementById(name).value = value;

  const container = document.querySelector(
    '.stars[data-rating-name="' + name + '"]'
  );

  const buttons = container.querySelectorAll("button");

  buttons.forEach((button, index) => {
    if (index < value) {
      button.classList.add("active");
    } else {
      button.classList.remove("active");
    }
  });
};
  
  const SUPABASE_URL = "https://zvojiadkpesvrqufhktj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_tB2lW-I3JYw4rVUArQSU_Q_q9o3sjAX";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

 async function loadRatings() {
  const { data, error } = await supabaseClient
    .from("Reviews")
    .select("story, art, characters, worldbuilding")
    .eq("chapter", chapterNumber);

  if (error) {
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    return;
  }

  const total = data.length;

  const avgStory =
    data.reduce((sum, review) => sum + review.story, 0) / total;

  const avgArt =
    data.reduce((sum, review) => sum + review.art, 0) / total;

  const avgCharacters =
    data.reduce((sum, review) => sum + review.characters, 0) / total;

  const avgWorldbuilding =
    data.reduce((sum, review) => sum + review.worldbuilding, 0) / total;

  document.getElementById("avg-story").textContent = avgStory.toFixed(1);
  document.getElementById("avg-art").textContent = avgArt.toFixed(1);
  document.getElementById("avg-characters").textContent = avgCharacters.toFixed(1);
  document.getElementById("avg-worldbuilding").textContent = avgWorldbuilding.toFixed(1);

  document.getElementById("review-count").textContent =
    total + (total === 1 ? " review" : " reviews");
}
  
  async function submitReview() {
    const story = parseInt(document.getElementById("story").value);
    const art = parseInt(document.getElementById("art").value);
    const characters = parseInt(document.getElementById("characters").value);
    const worldbuilding = parseInt(document.getElementById("worldbuilding").value);
    const feedback = document.getElementById("feedback").value;

    const { error } = await supabaseClient
      .from("Reviews")
      .insert([
        {
          chapter: chapterNumber,
          story: story,
          art: art,
          characters: characters,
          worldbuilding: worldbuilding,
          feedback: feedback
        }
      ]);

    if (error) {
  alert("Error: " + error.message);
  console.error(error);
} else {
      alert("Thank you! Your review was submitted.");
      localStorage.setItem("reviewed-chapter-" + chapterNumber, "yes");
      document.getElementById("review-form").style.display = "none";
      document.getElementById("reader-ratings").style.display = "block";
      loadRatings();
    }
  }
if (localStorage.getItem("reviewed-chapter-" + chapterNumber) === "yes") {
  document.getElementById("submit-review-button").style.display = "none";
  document.getElementById("reader-ratings").style.display = "block";
  loadRatings();
}
  
  
</script>


</body>
</html>
