<!DOCTYPE html>
<html>
<head>
  <title>Read Manga</title>

  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .chapter-nav {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 10px;
  font-size: 14px;
  color: #aaa;
}
    .topbar {
  position: sticky;
  top: 0;
  background-color: #111;
  padding: 15px;
  border-bottom: 1px solid #333;
  z-index: 10;
}

.topbar h1 {
  margin: 8px 0;
  font-size: 24px;
}

.topbar p {
  margin: 0;
  color: #aaa;
}

    .manga-page {
      display: block;
      width: 100%;
      max-width: 900px;
      margin: 0 auto 10px auto;
    }

    a {
      color: white;
    }

    .review-box {
  max-width: 700px;
  margin: 60px auto;
  padding: 25px;
  background-color: #181818;
  border: 1px solid #333;
  border-radius: 10px;
  text-align: left;
}

.review-box h2 {
  text-align: center;
}

.rating {
  margin: 18px 0;
}

select,
textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  background-color: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

    .stars button {
  background: none;
  border: none;
  font-size: 32px;
  cursor: pointer;
  color: #666;
  padding: 4px;
}

.stars button.active {
  color: gold;
}
    
  </style>
</head>

<body>

  <div class="topbar">
  <a href="index.html">← Home</a>

  <h1>Chapter 7 - Gathering Storm</h1>

  <div class="chapter-nav">
    <span>← Previous Chapter</span>
    <span>Chapter 7</span>
    <span>Next Chapter →</span>
  </div>
</div>

  <img class="manga-page" src="chapter-07-web/page-01.jpg">
  <img class="manga-page" src="chapter-07-web/page-02.jpg">
  <img class="manga-page" src="chapter-07-web/page-03.jpg">
  <img class="manga-page" src="chapter-07-web/page-04.jpg">
  <img class="manga-page" src="chapter-07-web/page-05.jpg">
  <img class="manga-page" src="chapter-07-web/page-06.jpg">
  <img class="manga-page" src="chapter-07-web/page-07.jpg">
  <img class="manga-page" src="chapter-07-web/page-08.jpg">
  <img class="manga-page" src="chapter-07-web/page-09.jpg">
  <img class="manga-page" src="chapter-07-web/page-10.jpg">
  <img class="manga-page" src="chapter-07-web/page-11.jpg">
  <img class="manga-page" src="chapter-07-web/page-12.jpg">
  <img class="manga-page" src="chapter-07-web/page-13.jpg">
  <img class="manga-page" src="chapter-07-web/page-14.jpg">
  <img class="manga-page" src="chapter-07-web/page-15.jpg">
  <img class="manga-page" src="chapter-07-web/page-16.jpg">
  <img class="manga-page" src="chapter-07-web/page-17.jpg">
  <img class="manga-page" src="chapter-07-web/page-18.jpg">

  <div class="review-box">

  <h2>Review Chapter 7</h2>

  <div class="rating">
  <label>Story</label>

  <div class="stars" data-rating-name="story">
    <button type="button" onclick="setRating('story', 1)">★</button>
    <button type="button" onclick="setRating('story', 2)">★</button>
    <button type="button" onclick="setRating('story', 3)">★</button>
    <button type="button" onclick="setRating('story', 4)">★</button>
    <button type="button" onclick="setRating('story', 5)">★</button>
  </div>

  <input type="hidden" id="story" value="5">
</div>

  <div class="rating">
  <label>Art</label>

  <div class="stars" data-rating-name="art">
    <button type="button" onclick="setRating('art', 1)">★</button>
    <button type="button" onclick="setRating('art', 2)">★</button>
    <button type="button" onclick="setRating('art', 3)">★</button>
    <button type="button" onclick="setRating('art', 4)">★</button>
    <button type="button" onclick="setRating('art', 5)">★</button>
  </div>

  <input type="hidden" id="art" value="5">
</div>

  <div class="rating">
  <label>Characters</label>

  <div class="stars" data-rating-name="characters">
    <button type="button" onclick="setRating('characters', 1)">★</button>
    <button type="button" onclick="setRating('characters', 2)">★</button>
    <button type="button" onclick="setRating('characters', 3)">★</button>
    <button type="button" onclick="setRating('characters', 4)">★</button>
    <button type="button" onclick="setRating('characters', 5)">★</button>
  </div>

  <input type="hidden" id="characters" value="5">
</div>

  <div class="rating">
  <label>Worldbuilding</label>

  <div class="stars" data-rating-name="worldbuilding">
    <button type="button" onclick="setRating('worldbuilding', 1)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 2)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 3)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 4)">★</button>
    <button type="button" onclick="setRating('worldbuilding', 5)">★</button>
  </div>

  <input type="hidden" id="worldbuilding" value="5">
</div>

  <div class="rating">
    <label>Written feedback</label>
    <textarea id="feedback" rows="6" placeholder="What did you think of this chapter?"></textarea>
  </div>

    
      
  <button onclick="submitReview()">Submit Review</button>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  window.setRating = function(name, value) {
  document.getElementById(name).value = value;

  const container = document.querySelector(
    '.stars[data-rating-name="' + name + '"]'
  );

  const buttons = container.querySelectorAll("button");

  buttons.forEach((button, index) => {
    if (index < value) {
      button.classList.add("active");
    } else {
      button.classList.remove("active");
    }
  });
};
  
  const SUPABASE_URL = "https://zvojiadkpesvrqufhktj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_tB2lW-I3JYw4rVUArQSU_Q_q9o3sjAX";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

 
  async function submitReview() {
    const story = parseInt(document.getElementById("story").value);
    const art = parseInt(document.getElementById("art").value);
    const characters = parseInt(document.getElementById("characters").value);
    const worldbuilding = parseInt(document.getElementById("worldbuilding").value);
    const feedback = document.getElementById("feedback").value;

    const { error } = await supabaseClient
      .from("Reviews")
      .insert([
        {
          chapter: "7",
          story: story,
          art: art,
          characters: characters,
          worldbuilding: worldbuilding,
          feedback: feedback
        }
      ]);

    if (error) {
  alert("Error: " + error.message);
  console.error(error);
} else {
      alert("Thank you! Your review was submitted.");
    }
  }
</script>


</body>
</html>
